<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reharm Lab · a jazz reharmonization engine you can play</title>
    <meta
      name="description"
      content="Turn the dial from L0 to L4 and hear a deterministic engine reharmonize jazz standards live: tritone subs, backdoor ii–Vs, gospel turnarounds, Coltrane changes, every move checked against the melody. Property-tested, runs entirely in your browser."
    />
    <meta name="author" content="Itai Lior · Software & Jazz Co-op" />
    <meta name="theme-color" content="#f6e9c9" />
    <!-- colour scheme before first paint (src/design/themes.ts: THEME_KEY and the theme ids) -->
    <script>
      try {
        var t = localStorage.getItem("reharm.theme");
        if (t === "northgate" || t === "panam") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://itailiors.github.io/reharm-lab/" />

    <!-- Open Graph (LinkedIn, Slack, Facebook, iMessage). Images need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reharm Lab · Itai Lior // Software & Jazz Co-op" />
    <meta property="og:title" content="Reharm Lab: a jazz reharmonization engine you can play" />
    <meta
      property="og:description"
      content="A deterministic TypeScript engine that reharmonizes standards from ii–Vs to L4 Coltrane changes, checks every move against the melody, and proves its own claims live in your browser. With a walking-bass trio, MIDI coach and practice passport."
    />
    <meta property="og:url" content="https://itailiors.github.io/reharm-lab/" />
    <meta property="og:image" content="https://itailiors.github.io/reharm-lab/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reharm Lab: a hand-drawn lead sheet where C7 is struck through in red pen and replaced by G♭9, with the reharm dial set to L3." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reharm Lab: a jazz reharmonization engine you can play" />
    <meta
      name="twitter:description"
      content="Deterministic engine, L0–L4 reharms, every move melody-checked, 9 claims proven live in the browser. Turn the dial and hear it."
    />
    <meta name="twitter:image" content="https://itailiors.github.io/reharm-lab/og-image.png" />
    <meta name="twitter:image:alt" content="Reharm Lab: a hand-drawn lead sheet where C7 is struck through in red pen and replaced by G♭9, with the reharm dial set to L3." />
    <!-- self-hosted OFL fonts (src/assets/fonts/fonts.css); the body face is fetched in parallel with the JS -->
    <link rel="preload" href="/src/assets/fonts/architects-daughter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/kalam-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/kalam-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
